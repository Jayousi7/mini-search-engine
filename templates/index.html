<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Search Engine + RAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(90deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .shimmer {
            background: linear-gradient(90deg, #1e293b 0%, #334155 50%, #1e293b 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="container mx-auto px-4 py-12 max-w-6xl">
        <header class="text-center mb-16">
            <h1 class="text-5xl font-extrabold mb-4 gradient-text">Mini Search Engine</h1>
            <p class="text-slate-400 text-lg">Classical Information Retrieval meets Retrieval-Augmented Generation</p>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
            <div class="glass p-6 rounded-2xl border-l-4 border-blue-500">
                <p class="text-slate-400 text-sm uppercase tracking-wider font-semibold mb-1">Mean Average Precision (MAP)</p>
                <p class="text-4xl font-bold text-blue-400">{{ metrics.map }}</p>
            </div>
            <div class="glass p-6 rounded-2xl border-l-4 border-purple-500">
                <p class="text-slate-400 text-sm uppercase tracking-wider font-semibold mb-1">Normalized DCG</p>
                <p class="text-4xl font-bold text-purple-400">{{ metrics.ndcg }}</p>
            </div>
        </div>
        <div class="mb-16">
            <div class="relative max-w-3xl mx-auto">
                <input type="text" id="queryInput" placeholder="Enter your aerodynamics query..." 
                    class="w-full bg-slate-800/50 border border-slate-700 text-white px-6 py-4 rounded-full text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all shadow-2xl">
                <button id="searchBtn" class="absolute right-2 top-2 bg-blue-600 hover:bg-blue-700 text-white px-8 py-2.5 rounded-full font-semibold transition-colors">
                    Search
                </button>
            </div>
        </div>
        <div id="resultsArea" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-12">
            <div class="lg:col-span-2">
                <h3 class="text-2xl font-bold mb-6 flex items-center">
                    <span class="bg-blue-500 w-2 h-8 rounded-full mr-3"></span>
                    Retrieved Documents
                </h3>
                <div id="docsList" class="space-y-6"></div>
            </div>
            <div class="lg:col-span-1">
                <div class="sticky top-8">
                    <h3 class="text-2xl font-bold mb-6 flex items-center">
                        <span class="bg-purple-500 w-2 h-8 rounded-full mr-3"></span>
                        AI Answer
                    </h3>
                    <div id="aiResponse" class="glass p-8 rounded-2xl border border-purple-500/30 leading-relaxed text-slate-200"></div>
                </div>
            </div>
        </div>
        <div id="loadingState" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                <div class="lg:col-span-2 space-y-6">
                    <div class="h-32 shimmer rounded-2xl"></div>
                    <div class="h-32 shimmer rounded-2xl"></div>
                    <div class="h-32 shimmer rounded-2xl"></div>
                </div>
                <div class="lg:col-span-1">
                    <div class="h-64 shimmer rounded-2xl"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const searchBtn = document.getElementById('searchBtn');
        const queryInput = document.getElementById('queryInput');
        const resultsArea = document.getElementById('resultsArea');
        const loadingState = document.getElementById('loadingState');
        const docsList = document.getElementById('docsList');
        const aiResponse = document.getElementById('aiResponse');
        async function performSearch() {
            const query = queryInput.value.trim();
            if (!query) return;
            resultsArea.classList.add('hidden');
            loadingState.classList.remove('hidden');
            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const data = await response.json();
                docsList.innerHTML = '';
                data.results.forEach(doc => {
                    const card = `
                        <div class="glass p-6 rounded-2xl transition-all hover:border-blue-500/50">
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-blue-400 font-bold">Doc #${doc.id}</span>
                                <span class="text-slate-500 text-xs font-mono">Similarity: ${doc.score}</span>
                            </div>
                            <p class="text-slate-300 text-sm leading-relaxed">${doc.text}</p>
                        </div>
                    `;
                    docsList.innerHTML += card;
                });
                aiResponse.innerText = data.ai_answer;
                loadingState.classList.add('hidden');
                resultsArea.classList.remove('hidden');
            } catch (err) {
                console.error(err);
                alert("An error occurred during search.");
                loadingState.classList.add('hidden');
            }
        }
        searchBtn.addEventListener('click', performSearch);
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
